services:

  postgres:
    image: postgres:17
    container_name: tomoor-postgres

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  api:
    build:
      context: ./Tomoor-CafeAPI

    container_name: tomoor-api

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - postgres

    expose:
      - "8000"

    volumes:
      - uploads_data:/app/uploads
      - ./Tomoor-CafeUI/src/assets:/app/seed-assets:ro


  ui:
    build:
      context: ./Tomoor-CafeUI
      args:
        VITE_API_URL: /api
        VITE_PUBLIC_SITE_URL: https://${DOMAIN}

    container_name: tomoor-ui

    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - api


volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config: