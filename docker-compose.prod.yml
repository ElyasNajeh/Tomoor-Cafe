services:

  postgres:
    image: postgres:17
    container_name: tomoor-postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10


  adminer:
    image: adminer:latest
    container_name: tomoor-adminer
    restart: unless-stopped

    depends_on:
      - postgres

    ports:
      - "127.0.0.1:8080:8080"


  api:
    build:
      context: ./Tomoor-CafeAPI

    container_name: tomoor-api
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - uploads_data:/app/uploads


  ui:
    build:
      context: ./Tomoor-CafeUI
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL}

    container_name: tomoor-ui
    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      - api


volumes:
  postgres_data:
  uploads_data: